name: Bug report
description: Help us reproduce a problem without sharing private activity.
body:
  - type: markdown
    attributes:
      value: "Please do not attach activity exports, databases, prompts or credentials."
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include what you expected and steps to reproduce.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: macOS version, app version, and relevant app or browser
    validations:
      required: true
  - type: dropdown
    id: browser
    attributes:
      label: Website identification
      options: ["Off", "On, Automation allowed", "On, permission denied or unknown", "Not relevant"]
